<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Meu Flashcard</h1>

    <div class="flashcard" id="flashcard">
        <div class="card-inner">

            <!-- FRENTE DO CARTÃO -->
            <div class="card-front">
                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500" alt="Imagem de tecnologia">

                <h2>O que é tecnologia?</h2>

                <p>Toque no cartão para descobrir!</p>
            </div>

            <!-- VERSO DO CARTÃO -->
            <div class="card-back">
                <h2>Resposta</h2>

                <p>
                    Tecnologia é o conjunto de conhecimentos,
                    técnicas e ferramentas usados para resolver
                    problemas e facilitar atividades do dia a dia.
                </p>

                <p>👆 Toque novamente para voltar.</p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
                              </html>
